<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>选择学校 · 拾光摄影社</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <main class="picker">
        <p class="eyebrow">拾光摄影社 / 报名助手</p>
        <h1>选择学校</h1>
        <p>点击校名即可回填到报名表。</p>
        <table id="school-list" class="striped" aria-label="学校列表">
            <thead>
                <tr>
                    <th>序号</th>
                    <th>学校名称</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01</td>
                    <td><a href="#">浙江大学</a></td>
                </tr>
                <tr>
                    <td>02</td>
                    <td><a href="#">浙江工业大学</a></td>
                </tr>
                <tr>
                    <td>03</td>
                    <td><a href="#">杭州电子科技大学</a></td>
                </tr>
                <tr>
                    <td>04</td>
                    <td><a href="#">浙江理工大学</a></td>
                </tr>
                <tr>
                    <td>05</td>
                    <td><a href="#">杭州师范大学</a></td>
                </tr>
                <tr>
                    <td>06</td>
                    <td><a href="#">浙江机电职业技术大学</a></td>
                </tr>
            </tbody>
        </table>
        <p id="school-status" role="status"></p>
    </main>
    <script src="js/school.js"></script>
</body>

</html>
