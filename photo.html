<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>社团风采 · 拾光摄影社</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body data-page="photo">
    <header id="site-header"></header>
    <main id="main" class="wrap">
        <div class="page-intro">
            <p class="eyebrow">01 / 影像档案</p>
            <h1>社团风采</h1>
            <p>从校门到校园广场，用六张照片记录校园风景。悬停体验动效，点击照片查看标题。</p>
        </div>
        <section class="section gallery-section" aria-label="照片墙">
            <div class="gallery">
                <figure><button type="button" class="frame round"><img src="images/campus-p1.jpg"
                            srcset="images/campus-p1-hd.jpg 2x" width="240" height="240" alt="校园广场中央的几何雕塑"
                            title="校园地标 · 几何雕塑"></button>
                    <figcaption>01 / 几何雕塑</figcaption>
                </figure>
                <figure><button type="button" class="frame round"><img src="images/campus-p2.jpg"
                            srcset="images/campus-p2-hd.jpg 2x" width="240" height="240" alt="开阔的校园广场、绿植与远处的楼群"
                            title="校园风景 · 广场远眺"></button>
                    <figcaption>02 / 广场远眺</figcaption>
                </figure>
                <figure><button type="button" class="frame clockwise"><img src="images/campus-p3.jpg"
                            srcset="images/campus-p3-hd.jpg 2x" width="240" height="240" alt="校园草坪上的线条雕塑"
                            title="校园细节 · 草坪雕塑"></button>
                    <figcaption>03 / 草坪雕塑</figcaption>
                </figure>
                <figure><button type="button" class="frame counter"><img src="images/campus-p4.jpg"
                            srcset="images/campus-p4-hd.jpg 2x" width="240" height="240" alt="写有浙江机电职业技术大学校名的校门"
                            title="校园入口 · 浙江机电职业技术大学"></button>
                    <figcaption>04 / 校园正门</figcaption>
                </figure>
                <figure><button type="button" class="frame zoom"><img src="images/campus-p5.jpg"
                            srcset="images/campus-p5-hd.jpg 2x" width="240" height="240" alt="蓝天下教学楼之间的绿地和步道"
                            title="校园建筑 · 楼间步道"></button>
                    <figcaption>05 / 楼间步道</figcaption>
                </figure>
                <figure><button type="button" class="frame zoom"><img src="images/campus-p6.jpg"
                            srcset="images/campus-p6-hd.jpg 2x" width="240" height="240" alt="蓝天与绿树映衬下的红砖楼"
                            title="建筑取景 · 蓝天下的红砖楼"></button>
                    <figcaption>06 / 红砖楼与蓝天</figcaption>
                </figure>
            </div>
            <div class="caption-panel" id="caption-panel" hidden>
                <p id="photo-caption" aria-live="polite"></p><button class="outline" id="close-caption"
                    type="button">关闭标题</button>
            </div>
        </section>
        <details id="credits" class="section card">
            <summary>图片来源与使用说明</summary>
            <p>照片墙的 P1–P6 均取自<a
                    href="https://www.zime.edu.cn/whjd/xygy.htm">浙江机电职业技术大学官网「校园光影」</a>，按文件编号排列，仅作校园风景展示，不作为社团活动实拍记录。
            </p>
            <p>首页横幅来自维基百科的<a
                    href="https://en.wikipedia.org/wiki/Early_buildings_of_Wuhan_University">武汉大学早期建筑</a>条目；首页活动卡片仍使用来自
                Unsplash 的摄影示例：<a href="https://images.unsplash.com/photo-1741622197924-5dae6fbd8bef">校园建筑</a>、<a
                    href="https://images.unsplash.com/photo-1635691627328-77798a0ee092">银杏</a>和<a
                    href="https://images.unsplash.com/photo-1737018363337-c11847e9f39b">图书馆光影</a>。</p>
        </details>
    </main>
    <footer id="site-footer"></footer>
    <script src="js/common.js"></script>
    <script src="js/photo.js"></script>
</body>

</html>
